<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      id="page-description"
      name="description"
      content="Historical article from the Zviad Gamsakhurdia Digital Museum."
    />
    <title>Historical Article | Zviad Gamsakhurdia Digital Museum</title>
    <link rel="stylesheet" href="../../styles.css" />
  </head>

  <body>
    <a class="skip-link" href="#article-content">Skip to content</a>

    <div class="history-article-page" data-article-page>
      <header>
        <a
          class="header-logo"
          href="/index.html"
          aria-label="Zviad Gamsakhurdia Digital Museum home"
        >
          <video
            class="logo"
            autoplay
            muted
            loop
            playsinline
            preload="metadata"
            aria-hidden="true"
          >
            <source src="/Images/logo.mp4" type="video/mp4" />
          </video>
        </a>

        <button
          class="header-burger-menu"
          type="button"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="header-menu"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav id="header-menu" class="header-menu" aria-label="Main navigation">
          <a href="/Family/family.html">Family</a>
          <a href="/Politics/politics.html">Politics</a>
          <a href="/Works/works.html">Works</a>
          <a href="/Blog/blog.html">Blog</a>
          <a href="/Archive/archive.html">Archive</a>
        </nav>
      </header>

      <main id="article-content">
        <div class="history-article__status" id="article-status" role="status">
          Loading article…
        </div>

        <article id="history-article" hidden>
          <section
            class="history-article__hero"
            aria-labelledby="article-title"
          >
            <div class="history-article__hero-copy">
              <nav
                id="article-breadcrumbs"
                class="history-article__breadcrumbs"
                aria-label="Breadcrumb"
              ></nav>

              <p id="article-label" class="section-label"></p>
              <h1 id="article-title"></h1>
              <p
                id="article-introduction"
                class="history-article__introduction"
              ></p>

              <div class="history-article__meta">
                <span id="article-period"></span>
                <span id="article-category"></span>
              </div>
            </div>

            <figure
              class="history-article__hero-figure"
              id="article-hero-figure"
            >
              <img id="article-hero-image" src="" alt="" />
              <figcaption id="article-hero-caption"></figcaption>
            </figure>
          </section>

          <div class="history-article__body">
            <aside class="history-article__aside" aria-label="Article sections">
              <p class="section-label">On this page</p>
              <nav id="article-section-navigation"></nav>
            </aside>

            <div id="article-sections" class="history-article__sections"></div>
          </div>

          <section
            class="history-article__related"
            aria-labelledby="related-title"
          >
            <div>
              <p class="section-label">Continue exploring</p>
              <h2 id="related-title">Related histories</h2>
            </div>
            <div
              id="article-related-links"
              class="history-article__related-links"
            ></div>
          </section>
        </article>
      </main>

      <footer class="archive-footer">
        <div class="archive-footer__copyright">
          <span>Zviad Gamsakhurdia Digital Museum</span>
          <a
            href="https://www.ailaw.llc"
            target="_blank"
            rel="noopener noreferrer"
          >
            © 2026 AI Law LLC
          </a>
        </div>

        <nav class="archive-footer__pages" aria-label="Secondary navigation">
          <a href="../about.html">About</a>
          <a href="../contact.html">Contact</a>
          <a href="../editorial-policy.html">Editorial Policy</a>
          <a href="../privacy-policy.html">Privacy Policy</a>
          <a href="../accessibility.html">Accessibility</a>
        </nav>

        <nav class="archive-footer__social" aria-label="Social media">
          <a href="#" target="_blank" rel="noopener noreferrer">Facebook</a>
          <a href="#" target="_blank" rel="noopener noreferrer">YouTube</a>
        </nav>
      </footer>
    </div>

    <noscript>
      <p class="history-article__noscript">
        This article template requires JavaScript to load its content.
      </p>
    </noscript>

    <script src="/Header-Footer/header-burger.js"></script>
    <script type="module" src="./history-article.js"></script>
  </body>
</html>
